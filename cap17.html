<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ferruccio Baggiolini — Cap. 17 — Si gira, mi sfamo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Georgia,serif; background:#1a1a1a; }
#header {
  background:#2c1810; padding:10px 14px;
  border-bottom:2px solid #8B6914;
  position:fixed; top:0; left:0; right:0; z-index:1000;
}
#header h1 { font-size:13px; color:#d4a843; font-weight:bold; }
#header p { font-size:10px; color:#908880; margin-top:2px; }
#map { position:fixed; top:52px; left:0; right:0; bottom:0; }
#back {
  position:fixed; bottom:16px; right:16px; z-index:1000;
  background:#2c1810; border:1px solid #8B6914; color:#d4a843;
  padding:8px 14px; border-radius:6px; font-family:Georgia;
  font-size:12px; text-decoration:none;
  box-shadow:0 2px 8px rgba(0,0,0,0.5);
}
</style>
</head>
<body>
<div id="header">
  <h1>Ferruccio Baggiolini — Cap. 17 — Si gira, mi sfamo</h1>
  <p>Brandenburg — Fürstenwalde · 22 aprile / 17 maggio 1945</p>
</div>
<div id="map"></div>
<a href="index.html" id="back">← Mappa completa</a>
<script>
const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Esri'});
const map = L.map('map',{center:[52.48,13.5],zoom:9,layers:[esriTopo]});

const RIT = {color:'#1E6B1E',weight:3,opacity:0.9,dashArray:'8 5'};

function pt(lat,lon,label,color,dir,off){
  dir=dir||'top'; off=off||[0,-8];
  return L.circleMarker([lat,lon],{radius:7,fillColor:'white',color:color,weight:2.5,fillOpacity:1})
    .bindTooltip(label,{permanent:true,direction:dir,className:'tt',offset:off})
    .bindPopup('<b style="font-family:Georgia">'+label.replace(/\n/g,'<br>')+'</b>',{closeButton:false});
}
function ptStar(lat,lon,label,color){
  return L.circleMarker([lat,lon],{radius:10,fillColor:color,color:'white',weight:2,fillOpacity:1})
    .bindTooltip(label,{permanent:true,direction:'top',className:'tt',offset:[0,-13]})
    .bindPopup('<b style="font-family:Georgia">'+label.replace(/\n/g,'<br>')+'</b>',{closeButton:false});
}
function km(lat,lon,text,color){
  return L.marker([lat,lon],{
    icon:L.divIcon({
      className:'',
      html:'<div style="display:inline-block;transform:translate(-50%,-50%);background:#ffffff;border:2.5px solid '+color+';border-radius:5px;padding:4px 10px;font-family:Georgia,serif;font-size:12px;color:'+color+';font-style:italic;font-weight:bold;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5);">'+text+'</div>',
      iconSize:[0,0],iconAnchor:[0,0]
    }),
    interactive:false,zIndexOffset:500
  });
}

// Percorso: Falkensee → attraverso Berlino → verso est → Fürstenwalde
// movimento caotico, a piedi e su camion sovietici, ~56 km
L.polyline([
  [52.547,13.093], // Falkensee
  [52.530,13.200], // Berlino ovest
  [52.520,13.413], // Berlino centro
  [52.500,13.600], // Berlino est
  [52.480,13.720], // periferia est
  [52.361,14.060], // Fürstenwalde
],RIT).addTo(map);

ptStar(52.547,13.093,'⭐ Falkensee\nLiberazione 22/4/1945','#d4a843').addTo(map);

pt(52.520,13.413,'Berlino\nchaos post-liberazione','#1E6B1E','bottom',[0,10]).addTo(map);

// Annotazione borraccia
pt(52.500,13.600,'SI.GIRA.M.\n26/4/1945\nMI.SFAMO','#1E6B1E','top',[0,-10]).addTo(map);

pt(52.361,14.060,'Fürstenwalde\n(Fustenvad)\nATTESA CASA 17/5/1945','#1E6B1E','right',[10,0]).addTo(map);

km(52.46,13.57,'~56 km','#1E6B1E').addTo(map);

const s=document.createElement('style');
s.textContent='.tt{background:rgba(20,10,5,0.9)!important;border:1px solid #8B6914!important;color:#f0e8d8!important;font-family:Georgia,serif!important;font-size:11px!important;padding:3px 8px!important;border-radius:3px!important;white-space:pre-line!important;box-shadow:0 2px 6px rgba(0,0,0,0.5)!important;}';
document.head.appendChild(s);
</script>
</body>
</html>
